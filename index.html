<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ITUNA CAMPUS — Realtime Demo</title>
  <style>
    body { font-family: system-ui, Arial; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    #messages { border: 1px solid #ddd; padding: 1rem; height: 300px; overflow: auto; background:#fafafa; }
    .msg { padding: 0.25rem 0.5rem; border-bottom: 1px solid #eee; }
    .meta { font-size: 0.8rem; color: #666; }
    #presence { margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>ITUNA CAMPUS — Realtime Demo</h1>

  <div id="presence">Connecting...</div>

  <div id="messages" aria-live="polite"></div>

  <form id="sendForm">
    <input id="name" placeholder="Your name" required style="width: 30%;" />
    <input id="text" placeholder="Type a message" required style="width: 50%;" />
    <button type="submit">Send</button>
  </form>

  <script type="module">
    // --- IMPORTS (Firebase v9 modular CDN) ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import {
      getDatabase, ref, push, onValue, serverTimestamp, set, onDisconnect, remove
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    // --- FIREBASE CONFIG (from user) ---
    const firebaseConfig = {
      apiKey: "AIzaSyCh0ag_VdGORUHls6EC0UJwHtOfIKlGvrg",
      authDomain: "studio-4506283840-c3334.firebaseapp.com",
      // If you created a Realtime Database, set its URL here. Common default format:
      databaseURL: "https://studio-4506283840-c3334-default-rtdb.firebaseio.com",
      projectId: "studio-4506283840-c3334",
      storageBucket: "studio-4506283840-c3334.firebasestorage.app",
      messagingSenderId: "627996462678",
      appId: "1:627996462678:web:df86340e53e426cc8f75f7"
    };

    // Initialize
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // Simple anonymous auth so we have a uid for presence
    signInAnonymously(auth).catch(console.error);

    const presenceEl = document.getElementById('presence');
    const messagesEl = document.getElementById('messages');
    const sendForm = document.getElementById('sendForm');
    const nameInput = document.getElementById('name');
    const textInput = document.getElementById('text');

    let myUid = null;
    let myPresenceRef = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) return;
      myUid = user.uid;
      presenceEl.textContent = `Connected as ${myUid} (anonymous)`;

      // Presence path: /presence/{uid}
      myPresenceRef = ref(db, 'presence/' + myUid);
      // Set presence to true and ensure it's removed on disconnect
      set(myPresenceRef, { online: true, lastSeen: serverTimestamp() }).catch(console.error);
      onDisconnect(myPresenceRef).remove();

      // Also monitor presence list
      const presListRef = ref(db, 'presence');
      onValue(presListRef, (snap) => {
        const data = snap.val() || {};
        const users = Object.keys(data).length;
        presenceEl.textContent = `Online users: ${users}`;
      });
    });

    // Listen for messages in realtime
    const messagesRef = ref(db, 'messages');
    onValue(messagesRef, (snapshot) => {
      const val = snapshot.val() || {};
      // Convert to array and sort by push key insertion order (native)
      const items = Object.keys(val).map(k => ({ id: k, ...val[k] }));
      // Render
      messagesEl.innerHTML = '';
      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<div><strong>${escapeHtml(item.name || 'Anon')}</strong> <span class="meta">${new Date(item.ts || 0).toLocaleString()}</span></div><div>${escapeHtml(item.text)}</div>`;
        messagesEl.appendChild(div);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });

    // Send message
    sendForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = nameInput.value.trim() || 'Anon';
      const text = textInput.value.trim();
      if (!text) return;
      try {
        await push(messagesRef, {
          name,
          text,
          ts: Date.now()
        });
        textInput.value = '';
      } catch (err) {
        console.error('Send failed', err);
        alert('Failed to send. See console.');
      }
    });

    // Simple XSS escape
    function escapeHtml(s) {
      return String(s)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }
  </script>
</body>
</html>
